<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1F4E"/>
      <stop offset="1" stop-color="#100C1E"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC4A3"/>
      <stop offset="1" stop-color="#F7936A"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE3D2"/>
      <stop offset="1" stop-color="#F9B793"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.45" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#F7936A" stop-opacity=".28"/>
      <stop offset="1" stop-color="#F7936A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <circle cx="460" cy="440" r="380" fill="url(#glow)"/>
  <g transform="translate(-20 40)">
  <!-- stars -->
  <circle cx="820" cy="200" r="9" fill="#FFC4A3" opacity=".8"/>
  <circle cx="190" cy="250" r="6" fill="#FFC4A3" opacity=".6"/>
  <circle cx="860" cy="430" r="5" fill="#FFC4A3" opacity=".5"/>
  <!-- thought cloud, drawn as one line with a gap where the pencil is still drawing -->
  <path d="M 560 610
           C 520 650, 430 652, 395 612
           C 330 640, 245 600, 250 530
           C 185 505, 185 410, 255 385
           C 245 300, 335 250, 405 285
           C 440 215, 560 205, 600 275
           C 670 240, 760 290, 745 370
           C 815 395, 815 490, 750 515"
        fill="none" stroke="url(#ink)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- thought bubble tail -->
  <circle cx="300" cy="700" r="34" fill="url(#ink)"/>
  <circle cx="225" cy="790" r="20" fill="url(#ink)"/>
  <!-- pencil, tip touching the open end of the cloud -->
  <g transform="translate(752 532) rotate(38) scale(.86)">
    <!-- tip graphite -->
    <path d="M0 0 L -22 -58 L 22 -58 Z" fill="#2A1F4E"/>
    <!-- sharpened wood -->
    <path d="M -22 -58 L -46 -120 L 46 -120 L 22 -58 Z" fill="url(#wood)"/>
    <!-- body -->
    <rect x="-46" y="-290" width="92" height="170" fill="url(#ink)"/>
    <rect x="-46" y="-290" width="30" height="170" fill="#FFFFFF" opacity=".18"/>
    <!-- ferrule -->
    <rect x="-48" y="-332" width="96" height="44" rx="6" fill="#D9D2EA"/>
    <rect x="-48" y="-316" width="96" height="8" fill="#ABA2C6"/>
    <!-- eraser -->
    <rect x="-46" y="-388" width="92" height="58" rx="22" fill="#FF8A8A"/>
  </g>
  </g>
</svg>
